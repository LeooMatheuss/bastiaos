name: ci

on:
  push:
    branches: [main, develop, testing]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint shell scripts
        run: shellcheck -x $(find tools ci -name '*.sh' -type f)

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict

  builder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build builder image
        run: docker build -f ci/Dockerfile.builder -t bastia-builder:dev ci/
      - name: Verify toolchain inside image
        run: docker run --rm bastia-builder:dev mmdebstrap --version

  test:
    runs-on: ubuntu-latest
    needs: builder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build builder image
        run: docker build -f ci/Dockerfile.builder -t bastia-builder:dev ci/
      - name: Run unit tests
        run: docker run --rm -v "$GITHUB_WORKSPACE:/workspace" bastia-builder:dev bats tests/unit
