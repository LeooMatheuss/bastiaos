site_name: BastiaOS Docs
site_description: Documentation for BastiaOS — a lightweight, secure-by-default Linux distribution.
site_url: https://leoomatheuss.github.io/bastiaos/
repo_url: https://github.com/LeooMatheuss/bastiaos
repo_name: LeooMatheuss/bastiaos
docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Mudar para tema escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Mudar para tema claro
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

extra_css:
  - assets/extra.css
nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/README.md
      - Proposta Arquitetura Ubuntu: architecture/proposta-arquitetura-ubuntu.md
